<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login &amp; Register | BOM BAP 봄밥</title>
    <meta name="description" content="Sign in or create your BOM BAP 봄밥 account.">
    <meta property="og:site_name" content="BOM BAP 봄밥">
    <meta property="og:title" content="Login &amp; Register | BOM BAP 봄밥">
    <meta property="og:description" content="Sign in or create your BOM BAP 봄밥 account.">
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="./login.css?v=e41f79dbd2f5" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;600;700&amp;family=Poppins:wght@700&amp;display=swap&amp;text=BOM%20AP%EB%B4%84%EB%B0%A5">
  <link rel="stylesheet" href="./branding.css?v=267f6895ede0">
</head>
  <body>
    <div class="auth-container">
      <p class="auth-brand"><span class="brand-wordmark"><span class="brand-english">BOM BAP</span><span class="brand-korean" lang="ko">봄밥</span></span></p>
      <div id="login-form" class="form-section active">
        <h2>Welcome Back!</h2>
        <form>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>
          <button type="submit" class="auth-button">Login</button>
        </form>
        <p class="toggle-link">
          Don't have an account?
          <span onclick="showRegisterForm()">Register here</span>
        </p>

        <div class="social-login">
          <p>Or login with</p>
          <div class="social-buttons">
            <button class="social-btn google">
              <i class="fab fa-google"></i> Google
            </button>
            <button class="social-btn facebook">
              <i class="fab fa-facebook-f"></i> Facebook
            </button>
          </div>
        </div>
      </div>

      <div id="register-form" class="form-section">
        <h2>Join Our Family!</h2>
        <form>
          <div class="form-group">
            <label for="register-name">Full Name</label>
            <input
              type="text"
              id="register-name"
              name="fullname"
              placeholder="Enter your full name"
              required
            />
          </div>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input
              type="email"
              id="register-email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input
              type="password"
              id="register-password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Confirm your password"
              required
            />
          </div>
          <button type="submit" class="auth-button">Register</button>
        </form>
        <p class="toggle-link">
          Already have an account?
          <span onclick="showLoginForm()">Login here</span>
        </p>

        <div class="social-login">
          <p>Or register with</p>
          <div class="social-buttons">
            <button class="social-btn google">
              <i class="fab fa-google"></i> Google
            </button>
            <button class="social-btn facebook">
              <i class="fab fa-facebook-f"></i> Facebook
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./login.js?v=d2c77daf5420"></script>
  </body>
</html>
